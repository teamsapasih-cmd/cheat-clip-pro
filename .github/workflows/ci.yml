name: Clip Intelligence Studio CI

on:
  push:
    branches:
      - master
      - clip-intelligence-upgrade
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

  backend-tests:
    name: Backend syntax and cloud foundation tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pytest "SQLAlchemy>=2.0.0"

      - name: Compile backend and tests
        run: python -m compileall -q backend tests

      - name: Test cloud configuration foundation
        run: python -m pytest -q tests/test_cloud_foundation.py

      - name: Test database schema and ownership
        run: python -m pytest -q tests/test_database_models.py
