name: Clip Intelligence Studio CI

on:
  push:
    branches:
      - master
      - clip-intelligence-upgrade
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend modules
        run: npx eslint src/services/workspaceApi.ts src/components/CloudWorkspacePanel.tsx

  backend-tests:
    name: Backend syntax and cloud foundation tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pytest "fastapi>=0.100.0" "pydantic>=2.0.0" "httpx>=0.25.0" "python-dotenv>=1.0.0" "Pillow>=10.0.0" "python-multipart>=0.0.9" "requests>=2.31.0" "youtube-transcript-api>=1.2.0" "SQLAlchemy>=2.0.0" "alembic>=1.13.0" "redis>=5.0.0" "boto3>=1.34.0" "pwdlib[argon2]>=0.2.0" "python-jose[cryptography]>=3.3.0" "email-validator>=2.1.0" "psycopg[binary]>=3.2.0"

      - name: Compile backend and tests
        run: python -m compileall -q backend tests

      - name: Test cloud configuration foundation
        run: python -m pytest -q tests/test_cloud_foundation.py

      - name: Test database schema and ownership
        run: python -m pytest -q tests/test_database_models.py

      - name: Test authentication primitives
        run: python -m pytest -q tests/test_auth_tokens.py tests/test_auth_api.py

      - name: Test cloud analysis job API
        run: python -m pytest -q tests/test_analysis_jobs_api.py

      - name: Test Redis queue retries and worker leases
        run: python -m pytest -q tests/test_redis_queue_reliability.py tests/test_worker_heartbeat.py

      - name: Test retention policy and cloud export idempotency
        run: python -m pytest -q tests/test_retention_policy.py tests/test_legacy_render_cloud_export.py tests/test_database_session.py

      - name: Test audio-only clip word transcription API
        run: python -m pytest -q tests/test_clip_word_transcription_api.py

      - name: Verify Alembic initial migration
        env:
          DATABASE_URL: sqlite:///./ci_migration_test.db
        run: alembic -c alembic.ini upgrade head
